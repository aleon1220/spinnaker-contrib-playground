# This file was generated by the Gradle 'init' task.
# https://docs.gradle.org/current/userguide/version_catalogs.html#sec::toml-dependencies-format
[versions]
axion = "1.21.2"
azureNative = "3.19.0"
catalogUpdateVersion_version = "1.1.0"
pulumiJava = "1.28.0"
shadow = "9.4.2"
spotless = "8.6.0"
versionUpdate_version = "0.54.0"

[plugins]
# https://axion-release-plugin.readthedocs.io/en/latest/
axion = { id = "pl.allegro.tech.build.axion-release", version.ref = "axion" }
# https://github.com/littlerobots/version-catalog-update-plugin
catalogUpdate = { id = "nl.littlerobots.version-catalog-update", version.ref = "catalogUpdateVersion_version" }
# https://gradleup.com/shadow/
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
# https://plugins.gradle.org/plugin/com.diffplug.spotless
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
versionUpdate = { id = "com.github.ben-manes.versions", version.ref = "versionUpdate_version" }

[libraries]
# Source: https://mvnrepository.com/artifact/com.pulumi/azure-native
azureNative = { module = "com.pulumi:azure-native", version.ref = "azureNative" }

# Source: https://mvnrepository.com/artifact/com.pulumi/pulumi
pulumiJava = { module = "com.pulumi:pulumi", version.ref = "pulumiJava" }
