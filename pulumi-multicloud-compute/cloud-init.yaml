#cloud-config

hostname: ${HOSTNAME}

write_files:
  - path: /etc/apt/apt.conf.d/80retries
    content: |
      Acquire::Retries "3";
    owner: root:root
    permissions: '0644'
  - path: /root/install-docker.sh
    content: |
      #!/bin/bash -eu
      apt-get update --quiet --yes
      apt-get install --quiet --yes ca-certificates curl gnupg lsb-release
      
      mkdir --parents /etc/apt/keyrings
      curl --fail --silent --show-error --location https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor --output /etc/apt/keyrings/docker.gpg
      
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release --short --codename) stable" > /etc/apt/sources.list.d/docker.list
      
      apt update --quiet --yes
      apt-get install docker-ce docker-ce-cli containerd.io docker-compose-plugin --quiet --yes
      usermod --append --groups docker ubuntu

      COMPOSE_VERSION="v2.18.1"
      DOCKER_COMPOSE_INSTALL="/usr/local/libexec/docker/cli-plugins"
      mkdir --parents --verbose $DOCKER_COMPOSE_INSTALL
      curl --location "https://github.com/docker/compose/releases/download/$COMPOSE_VERSION/docker-compose-linux-$(uname --machine)" --output "$DOCKER_COMPOSE_INSTALL/docker-compose"
      chmod --changes +x "$DOCKER_COMPOSE_INSTALL/docker-compose"
      cp --verbose "$DOCKER_COMPOSE_INSTALL/docker-compose" /usr/bin/
    owner: root:root
    permissions: '0755'
  - path: /root/install-k8s.sh
    content: |
      #!/bin/bash -eu
      
      curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
      kubectl version --client
    owner: root:root
    permissions: '0755' 

runcmd:
  - echo "VM setup via Pulumi for project ${PROJECT_NAME}"
  - echo 'export PATH=/home/ubuntu/bin:$PATH' >> /home/ubuntu/.bashrc
  - /root/install-docker.sh
  - /root/install-k8s.sh

power_state:
  mode: reboot
  condition: true
